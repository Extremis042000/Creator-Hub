spring:
  application:
    name: hub-backend

  # --- Database / JPA / Flyway: LIVE as of Phase 5 ---
  # Credentials come from real environment variables (DATABASE_URL,
  # DATABASE_USERNAME, DATABASE_PASSWORD), never hardcoded here — see
  # backend/.env.example. Nothing secret is committed; backend/.env is
  # gitignored and loaded by run-local.ps1.
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only validates it matches
    open-in-view: false

  flyway:
    locations: classpath:db/migration,classpath:com/extremis/hub/migration

extremis:
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://extremis-creator-hub.surya-chowdhury0412.workers.dev
  auth:
    google:
      # Founder-provided (Google Cloud Console) — see .env.example.
      # Left unset (empty) is fine: sign-in simply always reports
      # "not verified" until this is set, everything else keeps
      # working. Do NOT default this to a real-looking value.
      client-id: ${GOOGLE_CLIENT_ID:}
    jwt:
      # Required, no default — matches DATABASE_URL's pattern. The
      # app deliberately fails to start without this rather than
      # silently signing tokens with a placeholder secret.
      secret: ${JWT_SECRET}
      expiration-minutes: 10080 # 7 days
  admin:
    # Comma-separated allowlist (env var ADMIN_EMAILS) — see
    # AdminAccessProperties for why this is an env var, not a
    # database-backed role, for Phase 17. Left unset means no admin
    # access at all, which is the safe default.
    emails: ${ADMIN_EMAILS:}
  digital-products:
    # Never web-exposed — see DigitalProductProperties and DownloadController.
    secure-files-dir: ${SECURE_FILES_DIR:secure-files}
    # Required, no default — same pattern as JWT_SECRET (fails fast
    # rather than silently signing download tokens with a placeholder).
    download-signing-secret: ${DOWNLOAD_SIGNING_SECRET}
    download-link-expiry-minutes: 5
    # Kill switch — flip to false once Phase 20 lands a real
    # PaymentProvider, so a free "test purchase" never coexists with
    # real payments. See DigitalProductService#testPurchase.
    test-purchases-enabled: ${TEST_PURCHASES_ENABLED:true}
  ai:
    # Phase 26. Blank key = AiProviderConfig registers no bean, so every
    # AI-capable tool keeps using its existing template engine.
    enabled: ${AI_GENERATION_ENABLED:true}
    provider: ${AI_PROVIDER:openai-compatible}
    # openai-compatible provider(s). No defaults on purpose: an unvetted
    # third-party host must be named explicitly. Two slots so a second
    # backend (e.g. Free.ai alongside FreeModel) is config-only and the
    # two are round-robined -- see CompositeAiGenerationProvider. Either,
    # both, or neither may be set.
    compat:
      chat-url: ${AI_API_CHAT_URL:}
      api-key: ${AI_API_KEY:}
      model: ${AI_MODEL:}
      timeout-seconds: 30
      max-tokens-floor: 3000
    compat2:
      chat-url: ${AI_API_CHAT_URL_2:}
      api-key: ${AI_API_KEY_2:}
      model: ${AI_MODEL_2:}
      timeout-seconds: 30
      max-tokens-floor: 3000
    # anthropic provider (direct, if a key is ever supplied):
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5}
    effort: ${ANTHROPIC_EFFORT:low}
    timeout-seconds: 45
    max-retries: 1
  payment:
    phonepe:
      # Left blank = PaymentProviderConfig registers no bean, so
      # /api/v1/checkout/sessions keeps returning "not set up yet" and
      # the free test-mode purchase flow above remains the only path.
      # Fill in once the founder completes PhonePe onboarding.
      client-id: ${PHONEPE_CLIENT_ID:}
      client-secret: ${PHONEPE_CLIENT_SECRET:}
      client-version: ${PHONEPE_CLIENT_VERSION:}
      sandbox: ${PHONEPE_SANDBOX:true}
      # These are set once in the PhonePe Business Dashboard when
      # configuring the webhook URL -- PhonePe echoes them back per
      # request, they're never sent by us, unlike Cashfree's notify-url.
      webhook-username: ${PHONEPE_WEBHOOK_USERNAME:}
      webhook-password: ${PHONEPE_WEBHOOK_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Error tracking (Phase 24). Left blank = the SDK stays fully inert --
# no events sent, no startup behavior change -- until the founder's
# real Sentry DSN is set. send-default-pii off by default (privacy).
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}

server:
  # Render (and most PaaS hosts) assign a dynamic port via $PORT --
  # defaults to 8080 for local dev where that's unset.
  port: ${PORT:8080}
