name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # All backend secrets are stored as one combined dotenv-style
      # secret (CREATOR_HUB_SECRETS, "KEY=value" per line) rather than
      # separate named secrets -- parse it here into real env vars for
      # later steps, masking each value individually so nothing ever
      # appears unredacted in the log even though the source secret is
      # one multi-line blob.
      - name: Load secrets
        run: |
          while IFS='=' read -r key value; do
            key=$(printf '%s' "$key" | tr -d '\r' | xargs)
            value=$(printf '%s' "$value" | tr -d '\r')
            if [ -n "$key" ] && [ "${key:0:1}" != "#" ]; then
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            fi
          done <<< "${{ secrets.CREATOR_HUB_SECRETS }}"
      - run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
